[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dsmclib"
version = "0.5.0"
description = "Shared loading and analysis code for the DSMC exosphere gravity-wave campaigns"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "seaborn", "xarray", "netCDF4"]

[tool.setuptools]
packages = ["dsmclib"]

[tool.setuptools.package-data]
dsmclib = ["assets/graphite/fonts/*"]
